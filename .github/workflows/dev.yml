name: Dev builds

# A rolling build of main, so an unreleased commit can be tested without building it locally
# (#339). The jar is built once and published two ways:
#
#   - on a GitHub pre-release, for --jars or a Databricks volume:
#       https://github.com/Neutrinic/apilytics/releases/download/dev/apilytics_2.13-dev.jar
#   - inside the image, tagged `dev` and with the commit SHA:
#       ghcr.io/neutrinic/apilytics:dev
#
# Never a release: nothing goes to Maven Central, the pre-release is never marked Latest, and
# the image never takes the `latest` tag, which only release tags move (docker.yml). A manual
# run on another branch publishes to dev-<branch> instead, for testing before merge.

on:
  push:
    branches: [main]
  workflow_dispatch:

# One run at a time per branch, and never cancelled: a run cancelled mid-publish would leave
# the jar and the image on different commits. GitHub keeps at most one more run waiting, the
# newest, and each run builds the branch's head as it is when it starts, so the jar and image
# always end on the latest commit, from the same build.
concurrency:
  group: dev-builds-${{ github.ref }}
  cancel-in-progress: false

# Read-only unless a job says otherwise.
permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest

    outputs:
      tag: ${{ steps.name.outputs.tag }}
      commit: ${{ steps.name.outputs.commit }}
      commit_short: ${{ steps.name.outputs.commit_short }}

    steps:
      - uses: actions/checkout@v7
        with:
          # The branch's head now, not the commit that started the run, which a newer push
          # may have passed while this run waited.
          ref: ${{ github.ref }}
          # sbt-dynver derives the version from tags, so it needs history.
          fetch-depth: 0
          # sbt runs plugin and dependency code, and this job never pushes, so don't leave the
          # token on disk where that code could read it.
          persist-credentials: false

      - uses: actions/setup-java@v6.0.1
        with:
          distribution: temurin
          java-version: 17
          cache: sbt

      - uses: sbt/setup-sbt@v1

      # Built against Spark 4.0.0, as the release is: one jar for Spark 4.0 to 4.2.
      - name: Build the jar
        run: sbt -DsparkVersion=4.0.0 assembly checkShadedJar

      - name: Name the build
        id: name
        run: |
          set -euo pipefail
          if [ "$GITHUB_REF_NAME" = "main" ]; then
            TAG="dev"
          else
            TAG="dev-$(printf '%s' "$GITHUB_REF_NAME" | sed 's/[^A-Za-z0-9._-]/-/g')"
          fi
          COMMIT=$(git rev-parse HEAD)
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "commit=$COMMIT" >> "$GITHUB_OUTPUT"
          echo "commit_short=${COMMIT:0:7}" >> "$GITHUB_OUTPUT"
          mkdir dev-assets
          cp target/scala-2.13/apilytics.jar "dev-assets/apilytics_2.13-${TAG}.jar"

      - uses: actions/upload-artifact@v7
        with:
          name: dev-jar
          path: dev-assets/*.jar
          retention-days: 1

  publish-jar:
    needs: build
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.build.outputs.commit }}

      - uses: actions/download-artifact@v8
        with:
          name: dev-jar
          path: dev-assets

      - name: Publish the pre-release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.build.outputs.tag }}
          COMMIT: ${{ needs.build.outputs.commit }}
        run: |
          set -euo pipefail
          JAR="dev-assets/apilytics_2.13-${TAG}.jar"
          test -f "$JAR"

          # Read from the jar rather than recomputed, so the notes describe exactly what was
          # uploaded. sbt-dynver puts the commit in it.
          VERSION=$(unzip -p "$JAR" META-INF/MANIFEST.MF | sed -n 's/^Implementation-Version: *//p' | tr -d '\r')

          NOTES="Rolling development build. Not a release, and not on Maven Central.

          Commit: ${COMMIT}
          Version: ${VERSION}
          Image: ${REGISTRY}/${IMAGE_NAME}:${TAG}
          Built by: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"

          # Move the tag to this commit so the release's source link and its jar agree. A dev
          # tag matches neither sbt-dynver's v* pattern nor any workflow's tag trigger, so it
          # disturbs neither versioning nor releasing.
          git tag -f "$TAG" "$COMMIT"
          git push -f origin "refs/tags/$TAG"

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --prerelease --latest=false --title "$TAG" --notes "$NOTES"
          else
            gh release create "$TAG" --verify-tag --prerelease --latest=false --title "$TAG" --notes "$NOTES"
          fi

          gh release upload "$TAG" "$JAR" --clobber
          echo "Published $TAG at $COMMIT ($VERSION)"

  publish-image:
    needs: build
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.build.outputs.commit }}
          # This job runs no git commands; the registry login uses the token directly.
          persist-credentials: false

      # The Dockerfile copies the jar from where sbt assembly writes it.
      - uses: actions/download-artifact@v8
        with:
          name: dev-jar
          path: dev-assets

      - name: Place the jar for the Dockerfile
        run: |
          mkdir -p target/scala-2.13
          cp "dev-assets/apilytics_2.13-${{ needs.build.outputs.tag }}.jar" target/scala-2.13/apilytics.jar

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ needs.build.outputs.tag }}
            type=raw,value=${{ needs.build.outputs.commit_short }}
          # The built commit, which can be newer than the one that started the run.
          labels: |
            org.opencontainers.image.revision=${{ needs.build.outputs.commit }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/dist/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

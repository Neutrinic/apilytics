name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # One jar serves the whole Spark 4.x line, so every supported line is built and tested.
  #
  # The versions are chosen, not arbitrary. Spark's bundled jackson-module-scala enforces a
  # narrow databind range, and the range moves *within* a line as well as between them:
  # 4.1.0 wants [2.20, 2.21) but 4.1.3 wants [2.21, 2.22). A matrix of one patch per line
  # missed that entirely and the build was broken against 4.1.3 while CI stayed green.
  #
  # So: the floor (oldest supported patch), the newest patch of each line (what people
  # actually run), and both sides of the 4.1 range shift.
  build:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        spark: ["4.0.0", "4.0.4", "4.1.0", "4.1.3", "4.2.0"]

    name: build (Spark ${{ matrix.spark }})

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6.0.1
        with:
          distribution: temurin
          java-version: 17

      - uses: sbt/setup-sbt@v1

      - name: Compile
        run: sbt -DsparkVersion=${{ matrix.spark }} compile

      - name: Test
        run: sbt -DsparkVersion=${{ matrix.spark }} test

      - name: Assembly
        run: sbt -DsparkVersion=${{ matrix.spark }} assembly

  # Vulnerability gate for our dependencies. Matches by package coordinates (purl)
  # against OSV, so identity is exact — unlike dependency-check, which guesses CPEs
  # from jar evidence and misfires (every suppression we carry is a misidentification).
  # Runs in seconds and needs no database download, so it can gate PRs; OWASP stays
  # weekly and advisory (#200).
  vulnerabilities:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6.0.1
        with:
          distribution: temurin
          java-version: 17

      - uses: sbt/setup-sbt@v1

      - name: Generate SBOM
        run: sbt makeBom

      # osv-scanner only auto-detects SBOMs whose filename matches the CycloneDX
      # spec; sbt-sbom emits `<name>-<version>.bom.json`, which does not.
      - name: Normalise SBOM filename
        run: cp target/*.bom.json bom.cdx.json

      - name: Install osv-scanner
        run: |
          curl -sSfL -o "$RUNNER_TEMP/osv-scanner" \
            https://github.com/google/osv-scanner/releases/download/v2.5.0/osv-scanner_linux_amd64
          chmod +x "$RUNNER_TEMP/osv-scanner"

      - name: Scan dependencies
        run: |
          "$RUNNER_TEMP/osv-scanner" scan source -L bom.cdx.json

      - name: Upload SBOM
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: sbom
          path: bom.cdx.json

name: Docker

# The release image: ghcr.io/neutrinic/apilytics:X.Y.Z, :X.Y and :latest, from a release tag.
# Only this workflow moves `latest`, so `latest` is always the newest release. It used to follow
# every push to main, which put unreleased code behind the README's quick start (#339). Builds
# of main are tagged `dev` by dev.yml. A manual run must be started on a release tag; on a
# branch it has no tag to push.

on:
  push:
    tags: ['v*']
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6.0.1
        with:
          distribution: temurin
          java-version: 17

      - uses: sbt/setup-sbt@v1

      # Built against Spark 4.0.0, as the jar on Maven Central is.
      - name: Build JAR
        run: sbt -DsparkVersion=4.0.0 assembly

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/dist/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

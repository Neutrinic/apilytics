name: Security

on:
  # Runs on PRs so a dependency change is caught before it reaches main. Without
  # this the scan only ever reported after the fact, and a green CI was repeatedly
  # mistaken for a clean build (#185, #193). Viable only alongside the caching
  # below — gating PRs on a multi-hour job would not be.
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: '0 8 * * 1'  # Monday 8am UTC
  workflow_dispatch:

# Each run re-scans from scratch, so a queue of runs on the same ref is pure waste —
# only the newest result is meaningful. Without this, merges stack multi-hour runs
# and exhaust the GitHub API rate limit.
concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dependency-check:
    runs-on: ubuntu-latest
    # Runs land in ~7 minutes on the bulk data feed. Generous headroom, but low
    # enough that a hung NVD fetch fails quickly instead of burning the budget.
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v5.7.0
        with:
          distribution: temurin
          java-version: 17
          cache: sbt

      - uses: sbt/setup-sbt@v1

      # Advisory, never blocking — matching flare-spark. dependency-check identifies
      # dependencies by guessing CPEs from jar evidence, which misfires often enough
      # (log4cats as protonmail, Arrow Java as Arrow C++) that gating merges on it
      # costs more than it catches. The report is still published below.
      - name: OWASP Dependency Check
        continue-on-error: true
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: sbt dependencyCheck

      # No NVD cache on purpose. The bulk data feed configured in build.sbt gets a
      # cold run down to ~7 minutes, and the database lands inside the coursier cache
      # (.../org/owasp/dependency-check-utils/<v>/data/<v>/odc.mv.db) rather than a
      # home-directory path — awkward to cache and not worth it for the time saved.

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: dependency-check-report
          path: target/dependency-check/

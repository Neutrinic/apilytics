openapi: "3.0.3"
info:
  title: GitHub Issues (subset)
  version: "1.0"
servers:
  - url: https://api.github.com
paths:
  /repos/{owner}/{repo}/issues:
    get:
      operationId: listIssues
      parameters:
        - name: owner
          in: path
          required: true
          schema:
            type: string
        - name: repo
          in: path
          required: true
          schema:
            type: string
        - name: state
          in: query
          schema:
            type: string
        - name: per_page
          in: query
          schema:
            type: integer
      responses:
        "200":
          description: List of issues
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  required:
                    - id
                    - title
                    - state
                  properties:
                    id:
                      type: integer
                      format: int64
                    number:
                      type: integer
                    title:
                      type: string
                    state:
                      type: string
                    created_at:
                      type: string
                      format: date-time
                    user:
                      type: object
                      properties:
                        login:
                          type: string

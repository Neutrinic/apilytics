# PokeAPI Configuration for Apilytics
# No authentication required - fully public API

openapi = "https://raw.githubusercontent.com/PokeAPI/pokeapi/master/openapi.yml"

auth {
  type = none
}

pagination {
  style = offset
  offset-param = "offset"
  page-size-param = "limit"
  max-page-size = 100
  results-path = "/results"
}

schema {
  flatten-depth = 2
  array-handling = both
}

http {
  max-retries = 3
  max-backoff = "10 seconds"
  timeout = "30 seconds"
}

tables {
  pokemon {
    endpoint = "/api/v2/pokemon"
    data-path = "/results"
  }
  types {
    endpoint = "/api/v2/type"
    data-path = "/results"
  }
  abilities {
    endpoint = "/api/v2/ability"
    data-path = "/results"
  }
}

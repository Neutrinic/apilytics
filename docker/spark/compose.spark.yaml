name: apilytics-spark

services:
# http://localhost:8080
  spark-master:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: spark-master
    hostname: spark-master
    environment:
      - SPARK_ROLE=master
    volumes:
      - spark-events:/opt/spark/spark-events
      - ../../target/scala-2.13/apilytics.jar:/opt/spark/jars/apilytics.jar:ro
      - ../../examples:/opt/spark/examples:ro
    ports:
      - "7077:7077"
      - "8080:8080"
      - "4040:4040"
    networks:
      - apilytics-net

  spark-worker-1:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: spark-worker-1
    environment:
      - SPARK_ROLE=worker
      - SPARK_MASTER_URL=spark://spark-master:7077
      - SPARK_WORKER_CORES=2
      - SPARK_WORKER_MEMORY=4g
    volumes:
      - spark-events:/opt/spark/spark-events
      - ../../target/scala-2.13/apilytics.jar:/opt/spark/jars/apilytics.jar:ro
      - ../../examples:/opt/spark/examples:ro
    depends_on:
      - spark-master
    networks:
      - apilytics-net

  spark-worker-2:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: spark-worker-2
    environment:
      - SPARK_ROLE=worker
      - SPARK_MASTER_URL=spark://spark-master:7077
      - SPARK_WORKER_CORES=2
      - SPARK_WORKER_MEMORY=4g
    volumes:
      - spark-events:/opt/spark/spark-events
      - ../../target/scala-2.13/apilytics.jar:/opt/spark/jars/apilytics.jar:ro
      - ../../examples:/opt/spark/examples:ro
    depends_on:
      - spark-master
    networks:
      - apilytics-net

#  http://localhost:18080/
  spark-history:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: spark-history
    environment:
      - SPARK_ROLE=history
    volumes:
      - spark-events:/opt/spark/spark-events
    ports:
      - "18080:18080"
    depends_on:
      - spark-master
    networks:
      - apilytics-net

# JDBC: jdbc:hive2://localhost:10000
  spark-thrift:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: spark-thrift
    hostname: spark-thrift
    environment:
      - SPARK_ROLE=thriftserver
      - SPARK_MASTER_URL=spark://spark-master:7077
      # Configure catalogs: CATALOGS=api,github and CATALOG_<NAME>_CONFIG=path
      - CATALOGS=api
      - CATALOG_API_CONFIG=/opt/spark/examples/pokeapi/pokeapi-config.conf
    volumes:
      - spark-events:/opt/spark/spark-events
      - ../../target/scala-2.13/apilytics.jar:/opt/spark/jars/apilytics.jar:ro
      - ../../examples:/opt/spark/examples:ro
    ports:
      - "10000:10000"
    depends_on:
      - spark-master
    networks:
      - apilytics-net

# http://localhost:8888
  jupyter:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: jupyter
    environment:
      - SPARK_ROLE=jupyter
      - SPARK_MASTER_URL=local[*]
      - CATALOG_CONFIG=/opt/spark/examples/pokeapi/pokeapi-config.conf
    volumes:
      - ../../target/scala-2.13/apilytics.jar:/opt/spark/jars/apilytics.jar:ro
      - ../../examples:/opt/spark/examples
    ports:
      - "8888:8888"
    depends_on:
      - spark-master
    networks:
      - apilytics-net

volumes:
  spark-events: {}

networks:
  apilytics-net:
    driver: bridge

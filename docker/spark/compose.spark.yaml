name: apilytics-spark

services:
  spark-master:
    image: apache/spark
    container_name: spark-master
    hostname: spark-master
    environment:
      - SPARK_MODE=master
      - SPARK_EVENTLOG_ENABLED=true
      - SPARK_EVENTLOG_DIR=/opt/spark/events
    volumes:
      - spark-events:/opt/spark/events
      - ./target/scala-2.13/apilytics-assembly-0.1.0-SNAPSHOT.jar:/opt/spark/jars/apilytics.jar:ro
      - ./conf/spark-defaults.conf:/opt/spark/conf/spark-defaults.conf:ro
      - ./data:/data
    ports:
      - "7077:7077"   # Spark master
      - "8080:8080"   # Master UI
      - "4040:4040"   # Application UI
    networks:
      - apilytics-net

  spark-worker-1:
    image: apache/spark
    container_name: spark-worker-1
    environment:
      - SPARK_MODE=worker
      - SPARK_MASTER_URL=spark://spark-master:7077
      - SPARK_WORKER_CORES=2
      - SPARK_WORKER_MEMORY=4G
    volumes:
      - spark-events:/opt/spark/events
      - ./target/scala-2.13/apilytics-assembly-0.1.0-SNAPSHOT.jar:/opt/spark/jars/apilytics.jar:ro
      - ./data:/data
    depends_on:
      - spark-master
    networks:
      - apilytics-net

  spark-worker-2:
    image: apache/spark
    container_name: spark-worker-2
    environment:
      - SPARK_MODE=worker
      - SPARK_MASTER_URL=spark://spark-master:7077
      - SPARK_WORKER_CORES=2
      - SPARK_WORKER_MEMORY=4G
    volumes:
      - spark-events:/opt/spark/events
      - ./target/scala-2.13/apilytics-assembly-0.1.0-SNAPSHOT.jar:/opt/spark/jars/apilytics.jar:ro
      - ./data:/data
    depends_on:
      - spark-master
    networks:
      - apilytics-net

  spark-history:
    image: apache/spark
    container_name: spark-history
    environment:
      - SPARK_MODE=history-server
      - SPARK_HISTORY_SERVER_PORT=18080
      - SPARK_HISTORY_OPTS=-Dspark.history.fs.logDirectory=/opt/spark/events
    volumes:
      - spark-events:/opt/spark/events
    ports:
      - "18080:18080"
    depends_on:
      - spark-master
    networks:
      - apilytics-net

volumes:
  spark-events: {}

networks:
  apilytics-net:
    driver: bridge
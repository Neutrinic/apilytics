# Lichess NDJSON Streaming Example
# Streams live chess game moves as NDJSON
#
# Usage (Docker dev):
#   docker compose -f docker/spark/compose.spark.yaml up -d
#   docker exec -it spark-master spark-sql \
#     --conf spark.sql.catalog.api=com.apilytics.spark.RESTCatalog \
#     --conf spark.sql.catalog.api.config=/opt/spark/examples/lichess/lichess-ndjson.conf
#
#   spark-sql> SELECT * FROM api.default.tv_feed LIMIT 5;
#
# Note: This is a streaming endpoint that continuously emits game events.
# LIMIT is applied via stream.take(n) so queries will complete.

# Use petstore as a minimal valid OpenAPI spec (Lichess spec has unresolved $refs)
# We override everything via config, so the spec content doesn't matter
openapi = "https://petstore3.swagger.io/api/v3/openapi.json"

# Override to Lichess
base-url = "https://lichess.org"

auth {
  type = "none"
}

pagination {
  style = "none"
}

http {
  timeout = "60s"
  response-format = "ndjson"
}

schema {
  mode = "variant"  # Lichess events have varying structure
}

tables {
  # Live TV feed - streams moves from featured games
  # Returns: {"t":"featured|fen","d":{...}}
  tv_feed {
    endpoint = "/api/tv/feed"
  }
}

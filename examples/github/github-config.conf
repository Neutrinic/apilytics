# =============================================================================
# APIlytics Configuration Reference
# =============================================================================
# This file documents ALL available configuration options. It uses GitHub as
# an example, but GitHub's API doesn't support every feature shown here
# (e.g., aggregation endpoints, batch joins). Options that don't apply to
# GitHub are shown as commented examples.
#
# Usage:
#   export GITHUB_TOKEN=ghp_xxxxx  # optional, for higher rate limits
#   ./scripts/spark-shell.sh github
#
# Example queries:
#   spark.sql("SELECT * FROM api.default.issues LIMIT 10").show()
#   spark.sql("SELECT title, state FROM api.default.issues WHERE state = 'open'").show()
#   spark.sql("SELECT * FROM api.default.issues_partitioned").show()  # parallel fetch
# =============================================================================

# -----------------------------------------------------------------------------
# OpenAPI Spec URL (required)
# -----------------------------------------------------------------------------
# URL or file path to the OpenAPI 3.x specification (JSON or YAML)
openapi = "https://raw.githubusercontent.com/github/rest-api-description/main/descriptions/api.github.com/api.github.com.json"

# -----------------------------------------------------------------------------
# Cache
# -----------------------------------------------------------------------------
# Cache parsed OpenAPI specs to avoid re-parsing on every session.
# GitHub's 15MB+ spec takes ~16s to parse - caching makes cold starts instant.
cache {
  enabled = true
  ttl = "24h"  # Optional, default is indefinite (relies on ETag/mtime)
  # directory = "~/.apilytics/cache"  # Optional, defaults to ~/.apilytics/cache
}

# -----------------------------------------------------------------------------
# Authentication
# -----------------------------------------------------------------------------
# Supported types: none, bearer, basic, header, oauth2_client
auth {
  type = "none"
}

# Bearer token (most common):
# auth {
#   type = "bearer"
#   token = ${GITHUB_TOKEN}       # env var substitution
# }

# Basic auth:
# auth {
#   type = "basic"
#   username = ${API_USER}
#   password = ${API_PASS}
# }

# Custom header:
# auth {
#   type = "header"
#   header-name = "X-API-Key"
#   header-value = ${API_KEY}
# }

# OAuth2 client credentials:
# auth {
#   type = "oauth2_client"
#   client-id = ${CLIENT_ID}
#   client-secret = ${CLIENT_SECRET}
#   token-url = "https://api.example.com/oauth/token"
# }

# -----------------------------------------------------------------------------
# Pagination
# -----------------------------------------------------------------------------
# Supported styles: link_header, cursor, offset, none
#
# IMPORTANT: Pagination does not provide snapshot isolation. Records may be
# added, removed, or modified during a scan. This is inherent to REST API
# pagination — the server returns whatever data exists at each page fetch.
# For analytics requiring consistency, cache results locally first:
#   spark.table("api.default.issues").cache()
#
pagination {
  style = "link_header"           # GitHub uses RFC 5988 Link headers
  page-size-param = "per_page"    # query param for page size
  max-page-size = 100             # maximum items per request

  # For cursor pagination:
  # cursor-path = "/meta/next_cursor"  # JSON pointer to cursor in response
  # cursor-param = "cursor"            # query param name for cursor

  # For offset pagination:
  # offset-param = "offset"       # query param name for offset
  # results-path = "/results"     # JSON pointer to results array (for empty page detection)

  # Safety limits:
  # max-pages = 1000              # stop after N pages (prevents infinite loops)
}

# -----------------------------------------------------------------------------
# HTTP Client
# -----------------------------------------------------------------------------
http {
  timeout = "30s"                 # request timeout
  max-retries = 3                 # retry count for transient failures
  max-backoff = "30s"             # max delay between retries (exponential backoff)
  # rate-limit = 10               # max requests per second (omit for no limit)

  # Response format (default: json):
  #   json   - standard full-body JSON (default)
  #   ndjson - newline-delimited JSON (one object per line)
  #   sse    - Server-Sent Events (event stream with JSON data)
  #
  # Streaming formats (ndjson, sse) bypass pagination since they represent
  # continuous data streams. LIMIT is applied via stream.take(n).
  # response-format = "json"
}

# -----------------------------------------------------------------------------
# Schema Options
# -----------------------------------------------------------------------------
schema {
  # Flattening depth for nested objects:
  #   0 = no flattening, nested objects become JSON strings
  #   1 = flatten one level (user.name -> user_name)
  #   2 = flatten two levels (default)
  # GitHub has naming collisions at depth 1 (repository_url vs repository.url)
  flatten-depth = 0

  # Array handling:
  #   keep_array   = arrays stay as arrays (default)
  #   explode_view = create _exploded view with one row per element
  #   both         = keep array column AND create exploded view
  array-handling = "both"

  # Arrow batch size (rows per batch, affects memory usage)
  # arrow-batch-size = 4096

  # Explode semantics for empty arrays:
  #   false (default) = empty arrays produce no rows (INNER)
  #   true            = empty arrays produce one row with null (OUTER)
  # explode-outer = false
}

# -----------------------------------------------------------------------------
# Tables
# -----------------------------------------------------------------------------
# Define which API endpoints to expose as Spark tables.
# If omitted, all GET endpoints returning arrays are auto-discovered.
tables {
  # Simple table: just an endpoint
  issues {
    endpoint = "/repos/octocat/Hello-World/issues"

    # Optional: JSON pointer to data array in response
    # data-path = "/items"

    # Filter pushdown configuration
    # Maps SQL WHERE clauses to API query parameters
    filters = [
      { param = "state", column = "state", operators = ["eq"] }
      { param = "labels", column = "labels", operators = ["eq"] }
      { param = "since", column = "created_at", operators = ["gte"] }
    ]
    # Supported operators: eq, neq, gt, gte, lt, lte, like, in
    # SQL: WHERE state = 'open'  ->  API: ?state=open
  }

  # Enum partitioning example: fetch open and closed issues in parallel
  # This creates 2 partitions that execute concurrently across Spark executors.
  # Logs: "Partitioning by enum 'state' into 2 partitions: open, closed"
  issues_partitioned {
    endpoint = "/repos/octocat/Hello-World/issues"
    partition {
      type = "enum"
      param = "state"
      values = ["open", "closed"]
    }
  }

  # Parent-child join example (fetch comments for each issue):
  # issue-comments {
  #   endpoint = "/repos/octocat/Hello-World/issues/{issue_number}/comments"
  #   parent-table = "issues"           # parent table name
  #   parent-key = "number"             # field from parent to substitute
  #   join-strategy = "nested_loop"     # fetch child for each parent row
  # }

  # Batch join example (fetch many-to-many relationships efficiently):
  # For APIs that support bulk lookups via query parameters (e.g., ?ids=1,2,3),
  # the batch strategy reduces API calls from O(n) to O(n/batch_size).
  #
  # Use case: Fetch orders for thousands of customers
  # - Nested loop: 10,000 API calls (one per customer)
  # - Batch: 100 API calls (with batch-size=100)
  #
  # Requirements:
  # - Child endpoint must support query parameter lookups (not path templates)
  # - Child records must contain a field referencing the parent (e.g., customer_id)
  #
  # customer-orders {
  #   endpoint = "/orders"                    # base endpoint (no {params})
  #   parent-table = "customers"
  #   parent-key = "id"
  #   join-strategy = "batch"
  #   batch-param = "customer_ids"            # query param for bulk lookup
  #   batch-size = 100                        # max IDs per request (default: 100)
  #   batch-separator = ","                   # ID delimiter (default: ",")
  # }

  # Date-range partitioning example (partition by time window):
  # Splits a date range into fixed-size chunks for parallel fetching.
  # Requires filter pushdown for the date parameters.
  #
  # events {
  #   endpoint = "/events"
  #   filters = [
  #     { param = "since", column = "created_at", operators = ["gte"] }
  #     { param = "until", column = "created_at", operators = ["lt"] }
  #   ]
  #   partition {
  #     type = "date-range"
  #     column = "created_at"
  #     range = "1 day"                       # each partition covers 1 day
  #     start-param = "since"
  #     end-param = "until"
  #     format = "yyyy-MM-dd'T'HH:mm:ss'Z'"   # ISO 8601 (default)
  #   }
  # }
  # -> Query: WHERE created_at >= '2024-01-01' AND created_at < '2024-01-07'
  # -> Creates 7 partitions (one per day), fetching in parallel
  #
  # Rate limit distribution:
  # When partitioning is enabled, the configured rate-limit is automatically
  # divided across partitions. With rate-limit=100 and 5 partitions, each
  # partition gets 20 rps to maintain the overall 100 rps limit.

  # ---------------------------------------------------------------------------
  # Aggregation Pushdown
  # ---------------------------------------------------------------------------
  # For APIs that support server-side aggregations, configure endpoints for
  # each aggregate function. Apilytics pushes SUM, AVG, MIN, MAX, COUNT to
  # the API instead of fetching all data.
  #
  # Standard aggregations:
  # orders {
  #   endpoint = "/orders"
  #   aggregations {
  #     total_amount {
  #       function = "sum"                  # sum, avg, min, max, count
  #       column = "amount"                 # required for sum/avg/min/max
  #       endpoint = "/orders/stats"        # aggregation endpoint
  #       response-path = "/total"          # JSON pointer to result
  #     }
  #     avg_amount {
  #       function = "avg"
  #       column = "amount"
  #       endpoint = "/orders/stats"
  #       response-path = "/average"
  #     }
  #     order_count {
  #       function = "count"                # COUNT(*) - column not required
  #       endpoint = "/orders/count"
  #       response-path = "/count"
  #     }
  #   }
  # }
  #
  # Custom aggregations (percentiles, quartiles, etc.):
  # orders {
  #   endpoint = "/orders"
  #   aggregations {
  #     amount_p95 {
  #       function = "custom"
  #       name = "PERCENTILE"               # function name for SQL
  #       endpoint = "/orders/percentiles"
  #       response-path = "/p95"
  #       params {                          # additional query params
  #         percentile = "95"
  #         column = "amount"
  #       }
  #     }
  #   }
  # }
  #
  # Usage:
  #   SELECT SUM(amount), AVG(amount) FROM api.default.orders
  #   -> Makes requests to /orders/stats for each aggregate
  #
  # Pushed filter params are merged with aggregation params:
  #   SELECT SUM(amount) FROM api.default.orders WHERE status = 'completed'
  #   -> GET /orders/stats?status=completed
  #
  # Legacy COUNT(*) config (still supported):
  # items {
  #   endpoint = "/items"
  #   count {
  #     endpoint = "/items/count"
  #     response-path = "/total"
  #   }
  # }
}

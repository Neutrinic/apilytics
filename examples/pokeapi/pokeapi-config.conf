# PokeAPI Configuration for Apilytics
# No authentication required - fully public API

# Use URL to avoid path issues between dev and dist Docker images
openapi = "pokeapi-spec.yaml"

auth {
  type = header
  header-name = "Accept"
  header-value = "application/json"
}

pagination {
  style = offset
  offset-param = "offset"
  page-size-param = "limit"
  max-page-size = 100
  results-path = "/results"
}

schema {
  flatten-depth = 2
  array-handling = both  # Generate both base tables and exploded views
}

http {
  max-retries = 3
  max-backoff = "10 seconds"
  timeout = "30 seconds"
}

# Tables - extract from /results since PokeAPI wraps responses in pagination envelope
tables {
  pokemon {
    endpoint = "/api/v2/pokemon"
    data-path = "/results"
    filters = [
      { param = "limit", column = "limit", operators = ["eq"] }
    ]
  }
  types {
    endpoint = "/api/v2/type"
    data-path = "/results"
  }

  # Parent-child join: for each row in `types`, call the type-detail endpoint and
  # return the Pokemon that have that type. One API call per parent row, so the
  # row count is types x pokemon-per-type rather than a single response.
  #
  #   SELECT _parent_name AS type, pokemon_name FROM api.default.type_pokemon LIMIT 10
  #
  # `{type_name}` is substituted from the parent's `name` column; it matches the
  # spec's `/api/v2/type/{id}` by template, so the placeholder names need not agree.
  type_pokemon {
    endpoint = "/api/v2/type/{type_name}"
    parent-table = "types"
    parent-key = "name"
    data-path = "/pokemon"
    join-strategy = "nested_loop"

    # The detail endpoint returns a single object, so the source-level offset
    # pagination (which pages through /results) does not apply here.
    pagination { style = none }
  }
  abilities {
    endpoint = "/api/v2/ability"
    data-path = "/results"
  }
}

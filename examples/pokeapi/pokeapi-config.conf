# PokeAPI Configuration for Apilytics
# No authentication required - fully public API

openapi = "/opt/spark/examples/pokeapi/pokeapi-spec.yaml"

auth {
  type = header
  header-name = "Accept"
  header-value = "application/json"
}

pagination {
  style = offset
  offset-param = "offset"
  page-size-param = "limit"
  max-page-size = 100
  results-path = "/results"
}

schema {
  flatten-depth = 2
  array-handling = both  # Generate both base tables and exploded views
}

http {
  max-retries = 3
  max-backoff = "10 seconds"
  timeout = "30 seconds"
}

# Tables are auto-discovered from OpenAPI spec
# Custom table config can override defaults:
# tables {
#   pokemon {
#     endpoint = "/api/v2/pokemon"
#     data-path = "/results"
#   }
# }

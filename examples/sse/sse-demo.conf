# SSE Demo Configuration
# Uses sse.dev public test endpoint for Server-Sent Events
#
# Usage (Docker dev):
#   docker compose -f docker/spark/compose.spark.yaml up -d
#   docker exec -it spark-master spark-sql \
#     --conf spark.sql.catalog.api=com.apilytics.spark.RESTCatalog \
#     --conf spark.sql.catalog.api.config=/opt/spark/examples/sse/sse-demo.conf
#
#   spark-sql> SELECT * FROM api.default.events LIMIT 5;
#
# Note: sse.dev sends events every 2 seconds by default.
# LIMIT is applied via stream.take(n) so queries will complete.

# sse.dev doesn't have an OpenAPI spec, using petstore as placeholder
# The actual parsing happens based on response-format, not the spec
openapi = "https://petstore3.swagger.io/api/v3/openapi.json"

# Override to sse.dev
base-url = "https://sse.dev"

auth {
  type = "none"
}

pagination {
  style = "none"
}

http {
  timeout = "60s"
  response-format = "sse"
}

schema {
  mode = "variant"  # SSE events have dynamic structure
}

tables {
  # Default test endpoint - sends JSON every 2 seconds
  # Returns: {"testing":true,"sse_dev":"is great","msg":"It works!","now":...}
  events {
    endpoint = "/test"
  }
}

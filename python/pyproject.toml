[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "apilytics"
version = "0.0.0"
description = "Query APIs as tables. Python bindings — placeholder for a planned release."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
authors = [{ name = "Neutrinic" }]
keywords = ["api", "openapi", "arrow", "dataframe", "spark", "duckdb"]
classifiers = [
  "Development Status :: 1 - Planning",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Topic :: Database",
]

[project.urls]
Homepage = "https://github.com/Neutrinic/apilytics"
Source = "https://github.com/Neutrinic/apilytics"
Issues = "https://github.com/Neutrinic/apilytics/issues"

[tool.hatch.build.targets.wheel]
packages = ["apilytics"]
